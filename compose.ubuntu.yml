# Production: root-owned /opt/project1-auto/compose.yml, used by project1-auto-deploy.
# API_IMAGE and FRONTEND_IMAGE are exact GHCR digests supplied by the deploy script.
name: project1-auto

services:
  api:
    image: ${API_IMAGE:?Use project1-auto-deploy to select the API digest}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      Database__MigrateOnStartup: "true"
      Database__ExpectedDatabase: Project1Db
      Database__CommandTimeoutSeconds: "180"
      ConnectionStrings__DefaultConnection: "Server=tcp:host.docker.internal,1433;Database=Project1Db;User ID=${DB_USER:?Set the database login};Password=${DB_PASSWORD:?Set the database password};Encrypt=True;TrustServerCertificate=True"
      Jwt__Issuer: Project1.UbuntuProduction
      Jwt__Audience: Project1.UbuntuProduction.Frontend
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Set the JWT signing key}"
      # Preserve existing users/passwords. This does not disable normal roles/templates startup.
      DemoUsers__Enabled: "false"
      # Used only when an administrator explicitly creates a NEW user in the application.
      DemoUsers__DefaultPassword: "${NEW_USER_PASSWORD:?Set a password for NEW users only}"
      Email__Smtp__Host: smtp.gmail.com
      Email__Smtp__Port: "587"
      Email__Smtp__UseSsl: "true"
      Email__Smtp__Username: "${GMAIL_ADDRESS:?Enter Gmail privately on Ubuntu}"
      Email__Smtp__Password: "${GMAIL_APP_PASSWORD:?Enter a Google App Password privately}"
      Email__Smtp__FromAddress: "${GMAIL_ADDRESS:?Enter Gmail privately on Ubuntu}"
      Email__Smtp__FromName: Project1 Purchasing
    extra_hosts: ["host.docker.internal:host-gateway"]
    # No host API port and no SDK, SQL admin credentials, migration service or Docker socket.
    # Fail a deployment once, not an endless automatic migration retry loop.
    # The deployment script enables unless-stopped only after successful health checks.
    restart: "no"
    mem_limit: 1g
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      # Liveness only. Database permissions/schema and business tests are separate checks.
      test: [CMD, curl, --fail, --silent, --show-error, "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 300s

  frontend:
    image: ${FRONTEND_IMAGE:?Use project1-auto-deploy to select the frontend digest}
    ports: ["127.0.0.1:8084:8080"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, wget, --quiet, --output-document=/dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

# API applies reviewed pending migrations before seeding/workers/HTTP startup.
# SQL Server/data remain on the Ubuntu host. No database container, migration CLI or SDK.
# Existing host Nginx remains the port-80 entry point; HTTPS is separate work.
