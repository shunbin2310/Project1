# Reviewed existing site. Compared ignoring whitespace/comments, never installed as a backup.
# Rollback uses the exact original bytes captured privately from the real server.
server {
    listen 80;
    server_name 192.168.1.158 localhost 127.0.0.1;

    root /var/www/project1;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
