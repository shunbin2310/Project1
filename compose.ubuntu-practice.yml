# Ubuntu manual practice ONLY. Never combine with either local Compose file.
# Load versioned images first; this file cannot build/pull an application implicitly.
name: project1-ubuntu-practice

services:
  api:
    image: project1-ubuntu-practice-api:${PRACTICE_TAG:?Initialize the Ubuntu private configuration}
    pull_policy: never
    environment:
      # Private SSH-tunnel practice only, NOT a public production configuration.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=tcp:host.docker.internal,1433;Database=Project1DockerUbuntuPracticeDb;User ID=project1_ubuntu_practice;Password=${PRACTICE_SQL_PASSWORD:?Initialize the Ubuntu practice database};Encrypt=True;TrustServerCertificate=True"
      Jwt__Issuer: Project1.UbuntuPractice
      Jwt__Audience: Project1.UbuntuPractice.Frontend
      Jwt__SigningKey: "${PRACTICE_JWT_KEY:?Initialize the Ubuntu private configuration}"
      DemoUsers__Enabled: "true"
      DemoUsers__DepartmentCode: IT
      DemoUsers__DefaultPassword: "${PRACTICE_DEMO_PASSWORD:?Initialize the Ubuntu private configuration}"
      # Fail closed initially: no Mailpit/relay and no original application's SMTP secrets.
      Email__Smtp__Host: "${PRACTICE_SMTP_HOST:-127.0.0.1}"
      Email__Smtp__Port: "${PRACTICE_SMTP_PORT:-1}"
      Email__Smtp__UseSsl: "${PRACTICE_SMTP_SSL:-false}"
      Email__Smtp__Username: "${PRACTICE_SMTP_USERNAME:-}"
      Email__Smtp__Password: "${PRACTICE_SMTP_PASSWORD:-}"
      Email__Smtp__FromAddress: "${PRACTICE_SMTP_FROM:-purchasing@project1.invalid}"
      Email__Smtp__FromName: Project1 Ubuntu Practice
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No host port: only frontend talks to api:8080 inside this Compose network.
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      # Startup/HTTP check, not a claim that all SQL/PDF/email operations passed.
      test: [CMD, curl, --fail, --silent, --show-error, "http://127.0.0.1:8080/openapi/v1.json"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    image: project1-ubuntu-practice-frontend:${PRACTICE_TAG:?Initialize the Ubuntu private configuration}
    pull_policy: never
    ports: ["127.0.0.1:8083:8080"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, wget, --quiet, --output-document=/dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  migrate:
    profiles: [tools]
    image: project1-ubuntu-practice-migrate:${PRACTICE_TAG:?Initialize the Ubuntu private configuration}
    pull_policy: never
    # Separate privileged login for THIS practice database only; no Gmail/JWT/demo secrets.
    environment:
      ASPNETCORE_ENVIRONMENT: UbuntuPracticeMigration
      ConnectionStrings__DefaultConnection: "Server=tcp:host.docker.internal,1433;Database=Project1DockerUbuntuPracticeDb;User ID=project1_ubuntu_practice_migrator;Password=${PRACTICE_MIGRATION_PASSWORD:-};Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: migration-model-construction-only-not-an-authentication-key-000000
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: 1536m
    cpus: 1.0
    command:
      - database
      - update
      - --project
      - backend/Project1.Api
      - --startup-project
      - backend/Project1.Api
      - --configuration
      - Release
      - --no-build
      - --context
      - AppDbContext
      - --
      - --environment
      - UbuntuPracticeMigration

# No SQL Server container, database volume, host networking, Docker socket,
# bind mount, original Project1Db connection, or original /etc/project1 env file.
