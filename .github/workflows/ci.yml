name: Project1 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Public PRs run only on disposable GitHub-hosted machines, without deployment secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and Linux publish
    needs: migration-host-acceptance
    # An ordinary skipped dependent job can count as successful for branch rules.
    # Always run the explicit gate so the EXISTING required backend check fails closed.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      migration-sqlserver:
        # SQL Server 2025 image, pinned to the digest verified on 2026-10-10.
        image: mcr.microsoft.com/mssql/server@sha256:2b5b581621126574f3d1f75e78d3eebe8d05aedb59ad0cfdf9aa42cb0634d726
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: 'Express'
          # Public, disposable CI credential. Never use this outside this container.
          MSSQL_SA_PASSWORD: 'Project1CiOnly-Tests!2026'
          MSSQL_MEMORY_LIMIT_MB: '2048'
        ports:
          - '127.0.0.1:14333:1433'
        options: --hostname project1-ci-sqlserver --memory 3g
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Require isolated host acceptance before backend publication
        env:
          ACCEPTANCE_RESULT: ${{ needs.migration-host-acceptance.result }}
        run: test "$ACCEPTANCE_RESULT" = success

      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install fonts for PDF tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-dejavu-core

      - name: Restore backend and test dependencies
        run: dotnet restore Project1.slnx

      - name: Restore isolated SQL Server migration tests
        run: dotnet restore tests/Project1.Migrations.Tests/Project1.Migrations.Tests.csproj

      - name: Restore pinned EF Core CLI tool
        run: dotnet tool restore

      - name: Build fixed production SQL host without production access
        run: dotnet build scripts/deploy/dotnet/Project1.MigrationHost/Project1.MigrationHost.csproj --configuration Release --no-restore

      - name: Build and test backend
        # Keep business tests and their TRX separate from the SQL migration test project.
        run: dotnet test tests/Project1.Api.Tests/Project1.Api.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=backend.trx" --results-directory artifacts/backend-test-results

      - name: Check that model changes have a migration
        # Compare the SQL Server model with its snapshot; never apply migrations.
        # A non-Development environment avoids loading local user secrets.
        env:
          ConnectionStrings__DefaultConnection: 'Server=tcp:127.0.0.1,1;Database=Project1CiModelCheck;User Id=ci_model_check;Password=ci-model-check-not-a-real-password;Encrypt=True;TrustServerCertificate=False;Connect Timeout=1'
          # Public placeholder, not an authentication or deployment credential.
          Jwt__SigningKey: 'CI-model-check-only-not-for-authentication-000000000000'
          Jwt__Issuer: 'Project1.CI.ModelCheck'
          Jwt__Audience: 'Project1.CI.ModelCheck'
        run: >-
          dotnet tool run dotnet-ef -- migrations has-pending-model-changes
          --project backend/Project1.Api
          --startup-project backend/Project1.Api
          --configuration Release --no-build --context AppDbContext
          -- --environment CiModelCheck

      - name: Test fresh database and existing database migrations on SQL Server
        # These tests never read appsettings, user secrets, or deployment secrets.
        env:
          PROJECT1_CI_MIGRATION_TESTS: 'true'
          PROJECT1_CI_SQLSERVER_PASSWORD: 'Project1CiOnly-Tests!2026'
        run: >-
          dotnet test tests/Project1.Migrations.Tests/Project1.Migrations.Tests.csproj
          --configuration Release --no-restore
          --filter "FullyQualifiedName!~MigrationSqlIntegrationTests&FullyQualifiedName!~MigrationExecutorSqlIntegrationTests&FullyQualifiedName!~MigrationExecutionWorkflowSqlTests"
          --logger "trx;LogFileName=migrations.trx"
          --results-directory artifacts/backend-test-results

      - name: Generate reviewable migration SQL (no database access)
        # Generate only: never apply SQL or use deployment credentials.
        # Explicit non-Development settings avoid local user secrets.
        env:
          ConnectionStrings__DefaultConnection: 'Server=tcp:127.0.0.1,1;Database=Project1CiScript;User Id=ci_script;Password=ci-script-not-a-real-password;Encrypt=True;TrustServerCertificate=False;Connect Timeout=1'
          Jwt__SigningKey: 'CI-migration-script-only-not-for-authentication-000000000000'
          Jwt__Issuer: 'Project1.CI.MigrationScript'
          Jwt__Audience: 'Project1.CI.MigrationScript'
        run: |
          mkdir -p artifacts/migrations
          dotnet tool run dotnet-ef -- migrations script 0 --idempotent \
            --project backend/Project1.Api \
            --startup-project backend/Project1.Api \
            --configuration Release --no-build --context AppDbContext \
            --output artifacts/migrations/migrations.sql \
            -- --environment CiMigrationScript
          test -s artifacts/migrations/migrations.sql
          dotnet tool run dotnet-ef -- migrations list --no-connect --json --prefix-output \
            --project backend/Project1.Api \
            --startup-project backend/Project1.Api \
            --configuration Release --no-build --context AppDbContext \
            -- --environment CiMigrationScript > "$RUNNER_TEMP/project1-migration-list.txt"
          python3 scripts/deploy/migration_package.py \
            --ef-list "$RUNNER_TEMP/project1-migration-list.txt" \
            --directory artifacts/migrations
          printf '%s\n' \
            "Repository: $GITHUB_REPOSITORY" \
            "Commit SHA: $GITHUB_SHA" \
            "Checked-out commit: $(git rev-parse HEAD)" \
            "CI run ID: $GITHUB_RUN_ID" \
            "CI run attempt: $GITHUB_RUN_ATTEMPT" \
            "Event: $GITHUB_EVENT_NAME" \
            "Ref: $GITHUB_REF" \
            "Run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            'Migration range: 0 to latest migration in this commit; idempotent SQL Server script.' \
            'REVIEW REQUIRED: production execution needs a separately registered administrator approval.' \
            'Review, test against the target schema and back up before manual production use.' \
            > artifacts/migrations/build-info.txt
          cd artifacts/migrations
          sha256sum migrations.sql build-info.txt migration-manifest.json > SHA256SUMS

      - name: Test deployment and read-only migration tooling without server access
        run: python3 -m unittest discover -s scripts/deploy/tests -v

      - name: Test generated SQL on disposable SQL Server databases
        # Execute the exact file that will be uploaded, never SQL on the production server.
        env:
          PROJECT1_CI_MIGRATION_TESTS: 'true'
          PROJECT1_CI_SQLSERVER_PASSWORD: 'Project1CiOnly-Tests!2026'
        run: >-
          dotnet test tests/Project1.Migrations.Tests/Project1.Migrations.Tests.csproj
          --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName~MigrationSqlIntegrationTests"
          --logger "trx;LogFileName=migration-sql.trx"
          --results-directory artifacts/backend-test-results

      - name: Test restricted migration account on disposable SQL Server databases
        # Only the reviewed Note upgrade, with a separate randomly named CI login.
        # Never grant production permissions or use deployment secrets.
        env:
          PROJECT1_CI_MIGRATION_TESTS: 'true'
          PROJECT1_CI_SQLSERVER_PASSWORD: 'Project1CiOnly-Tests!2026'
        run: >-
          dotnet test tests/Project1.Migrations.Tests/Project1.Migrations.Tests.csproj
          --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName~MigrationExecutorSqlIntegrationTests"
          --logger "trx;LogFileName=migration-executor.trx"
          --results-directory artifacts/backend-test-results

      - name: Test coordinated execution and real backups on disposable SQL Server
        # New executor has no production factory/CLI. Backup admin rights stay in the fixture.
        env:
          PROJECT1_CI_MIGRATION_TESTS: 'true'
          PROJECT1_CI_SQLSERVER_PASSWORD: 'Project1CiOnly-Tests!2026'
          PROJECT1_CI_SQLSERVER_CONTAINER: ${{ job.services.migration-sqlserver.id }}
        run: >-
          dotnet test tests/Project1.Migrations.Tests/Project1.Migrations.Tests.csproj
          --configuration Release --no-build --no-restore
          --filter "FullyQualifiedName~MigrationExecutionWorkflowSqlTests"
          --logger "trx;LogFileName=migration-workflow.trx"
          --results-directory artifacts/backend-test-results

      - name: Verify migration SQL files are unchanged after tests
        working-directory: artifacts/migrations
        run: sha256sum -c SHA256SUMS

      - name: Save reviewable migration SQL
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: project1-migrations-sql-${{ github.sha }}
          path: artifacts/migrations/
          if-no-files-found: error
          retention-days: 14

      - name: Show migration SQL Server logs on failure
        if: ${{ failure() }}
        run: docker logs "${{ job.services.migration-sqlserver.id }}"

      - name: Save backend test results
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: backend-test-results-${{ github.sha }}
          path: artifacts/backend-test-results/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish backend for Ubuntu x64
        run: dotnet publish backend/Project1.Api/Project1.Api.csproj --configuration Release --runtime linux-x64 --self-contained false --output artifacts/api

      - name: Save backend build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: project1-api-linux-x64-${{ github.sha }}
          path: |
            artifacts/api/
            !artifacts/api/appsettings.Development.json
          if-no-files-found: error
          retention-days: 14

  migration-host-acceptance:
    name: Isolated Ubuntu migration host acceptance
    # A separate disposable VM: never use a self-hosted/production runner here.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out code without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish unchanged fixed host and CI-only SQL provisioner
        run: |
          dotnet publish scripts/deploy/dotnet/Project1.MigrationHost/Project1.MigrationHost.csproj \
            --configuration Release --runtime linux-x64 --self-contained false \
            --output artifacts/host-acceptance/host
          dotnet publish tests/Project1.MigrationHost.Acceptance/Project1.MigrationHost.Acceptance.csproj \
            --configuration Release --runtime linux-x64 --self-contained false \
            --output artifacts/host-acceptance/fixture

      - name: Accept root installation, actual stdio host, sudo and durable execution in disposable VM
        # Explicit minimal environment: no deployment secrets, token, SSH or Tailscale.
        # Script creates its OWN pinned SQL container bound only to runner loopback.
        run: |
          sudo /usr/bin/env -i PATH=/usr/bin:/bin HOME=/root \
            GITHUB_ACTIONS=true GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_JOB=migration-host-acceptance \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            PROJECT1_HOST_ACCEPTANCE=disposable-github-runner-v1 \
            /usr/bin/python3 -I scripts/deploy/ci_host_acceptance.py \
            scripts/deploy artifacts/host-acceptance/host artifacts/host-acceptance/fixture \
            "$(command -v dotnet)"

      - name: Explain acceptance boundary
        if: ${{ success() }}
        run: |
          printf '%s\n' \
            '## Isolated Ubuntu host acceptance passed' \
            'Tested real root files, sudo restrictions, fixed stdio host, scoped backup verifier, SQL lock, rollback, reviewed SQL bytes and durable approval consumption.' \
            'Artifact provenance is synthetic in this fixture; production online registration and wrapper SQL submission are NOT exercised.' \
            'No homelab access, production secrets, SSH, Tailscale or service restart. Production migration remains off.' \
            >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend checks and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check lint without changing files
        run: npm run lint:check

      - name: Run frontend unit tests
        run: npm run test:unit -- --run --reporter=default --reporter=junit --outputFile=../artifacts/frontend-test-results/vitest.xml

      - name: Save frontend test results
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: frontend-test-results-${{ github.sha }}
          path: artifacts/frontend-test-results/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Type-check and build frontend
        # Empty base URL means same-origin /api requests through the Ubuntu Nginx proxy.
        env:
          VITE_API_BASE_URL: ''
        run: npm run build

      - name: Save frontend build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: project1-frontend-dist-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14
