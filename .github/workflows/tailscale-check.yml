name: Project1 Tailscale connectivity check

# A manual network and SSH login test, not a deployment. Merge into main before running.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: project1-tailscale-connectivity-check
  cancel-in-progress: false

jobs:
  connectivity:
    name: Check Ubuntu SSH login through Tailscale
    # Match the OIDC trust credential: main branch and workflow_dispatch only.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
    defaults:
      run:
        shell: bash
    env:
      SERVER_TAILSCALE_IP: '100.78.117.97'
      DEPLOY_SSH_USER: 'project1_deploy'

    steps:
      - name: Check required configuration without printing values
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          if [[ -z "$TS_OAUTH_CLIENT_ID" || -z "$TS_AUDIENCE" ]]; then
            echo "::error::Set repository secrets TS_OAUTH_CLIENT_ID and TS_AUDIENCE before running this workflow."
            exit 1
          fi
          if [[ -z "$DEPLOY_SSH_PRIVATE_KEY" || -z "$DEPLOY_SSH_KNOWN_HOSTS" ]]; then
            echo "::error::Set repository secrets DEPLOY_SSH_PRIVATE_KEY and DEPLOY_SSH_KNOWN_HOSTS before running this workflow."
            exit 1
          fi
          command -v nc > /dev/null
          command -v ssh > /dev/null
          command -v ssh-keygen > /dev/null
          command -v timeout > /dev/null

      - name: Join Tailscale using GitHub OIDC
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:github-deploy
          version: '1.102.5'
          use-cache: 'false'

      - name: Check TCP port 22 without SSH login
        # TCP connectivity checks the network grant; Tailscale ping alone does not.
        # This step only checks the port; SSH authentication is tested in the next step.
        run: |
          for attempt in $(seq 1 12); do
            if nc -z -w 5 "$SERVER_TAILSCALE_IP" 22; then
              echo "TCP port 22 is reachable through Tailscale. No SSH login was attempted."
              exit 0
            fi
            echo "TCP port 22 is not reachable yet (attempt $attempt/12)."
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done
          echo "::error::Could not reach Ubuntu TCP port 22. Check server power, Wi-Fi, tailscaled, OpenSSH, firewall, and Tailscale grants."
          exit 1

      - name: Verify SSH login as project1_deploy (whoami only)
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          SSH_TMP_DIR=$(mktemp -d "$RUNNER_TEMP/project1-ssh-check.XXXXXX")
          trap 'rm -rf -- "$SSH_TMP_DIR"' EXIT

          # Preserve multiline values, normalize Windows line endings, and never print them.
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' > "$SSH_TMP_DIR/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" | tr -d '\r' > "$SSH_TMP_DIR/known_hosts"
          unset DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS

          if ! ssh-keygen -y -P '' -f "$SSH_TMP_DIR/deploy_key" > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_PRIVATE_KEY must contain a complete, unencrypted OpenSSH private key."
            exit 1
          fi
          if ! ssh-keygen -lf "$SSH_TMP_DIR/known_hosts" > /dev/null 2>&1 ||
             ! ssh-keygen -F "$SERVER_TAILSCALE_IP" -f "$SSH_TMP_DIR/known_hosts" > /dev/null 2>&1; then
            echo "::error::DEPLOY_SSH_KNOWN_HOSTS must contain a valid host public key for the server Tailscale IP."
            exit 1
          fi

          # No checkout, uploads, sudo, deployment, or service changes.
          if ! SSH_USER=$(timeout 45s ssh -F /dev/null -T \
            -i "$SSH_TMP_DIR/deploy_key" \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o PreferredAuthentications=publickey \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$SSH_TMP_DIR/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o HostKeyAlgorithms=ssh-ed25519 \
            -o UpdateHostKeys=no \
            -o ConnectTimeout=10 \
            -o ConnectionAttempts=1 \
            "$DEPLOY_SSH_USER@$SERVER_TAILSCALE_IP" whoami); then
            echo "::error::SSH login failed. Check the private key, authorized_keys, pinned host key, and server SSH configuration."
            exit 1
          fi
          if [[ "$SSH_USER" != "$DEPLOY_SSH_USER" ]]; then
            echo "::error::SSH returned an unexpected user. Expected project1_deploy."
            exit 1
          fi
          echo "SSH login verified: project1_deploy. Only whoami was executed; no deployment was performed."

# The pinned Tailscale action logs out and cleans up its temporary node after the job.
