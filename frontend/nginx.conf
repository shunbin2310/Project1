server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Re-resolve the Compose service if the API container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Frontend-only health check; does not claim that the API/DB is healthy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Preserve /api and the query string; do not fall back to Vue on API errors.
    location ~ ^/api(?:/|$) {
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # New builds should not leave the browser using an old HTML entry point.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Vite gives assets content hashes. Missing assets must really return 404.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vue Router uses history mode: direct links and refresh need index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
